<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港風天堂生存 RPG・終極爆款版</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #0f051d 0%, #1a0b2e 50%, #091326 100%);
            color: #f0f6fc;
            font-family: "Courier New", Courier, monospace, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%; max-width: 460px;
            height: 100%; max-height: 840px;
            background: rgba(18, 22, 34, 0.95);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.25), inset 0 0 20px rgba(88, 166, 255, 0.1);
            display: flex; flex-direction: column;
            border: 3px solid #f1c40f;
            overflow: hidden;
        }
        #game-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #e74c3c, #f1c40f, #3498db, #9b59b6);
            animation: neonGlow 3s linear infinite;
        }
        @keyframes neonGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(30, 20, 50, 0.85) 0%, rgba(10, 14, 23, 0.98) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 25px; text-align: center; z-index: 10;
            overflow-y: auto;
        }
        .hidden { display: none !important; }

        h1 { 
            color: #f1c40f; margin-bottom: 12px; font-size: 22px; 
            text-shadow: 2px 2px #d35400, 0 0 10px rgba(241, 196, 15, 0.6); 
            letter-spacing: 1px;
        }
        p { color: #8b949e; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        
        .btn {
            background: linear-gradient(135deg, #d35400, #e67e22);
            color: #fff; border: 2px solid #f1c40f; padding: 12px 18px;
            font-size: 13px; font-weight: bold; border-radius: 8px;
            cursor: pointer; margin: 6px 0; width: 100%; max-width: 300px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.4);
            font-family: inherit; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: linear-gradient(135deg, #1b2430, #253342); border-color: #58a6ff; color: #58a6ff; }
        
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 300px; margin: 6px 0;
        }
        .menu-grid .btn { width: 100%; max-width: none; margin: 0; padding: 10px; font-size: 11px; }
        .menu-full { width: 100%; max-width: 300px; margin: 5px 0; }

        input {
            width: 100%; max-width: 300px; padding: 14px 16px;
            margin: 10px 0; background: #07090f; border: 2px solid #30363d;
            color: white; border-radius: 8px; font-size: 14px; text-align: center;
            font-family: inherit;
        }
        input:focus { border-color: #f1c40f; outline: none; box-shadow: 0 0 8px rgba(241,196,15,0.4); }

        #rpg-screen { justify-content: flex-start; padding: 12px; text-align: left; }
        .hud-panel {
            background: rgba(22, 27, 34, 0.9); border: 2px solid #f1c40f; border-radius: 8px;
            padding: 10px 12px; width: 100%; margin-bottom: 8px; font-size: 11px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .bar-bg { width: 100%; height: 6px; background: #07090f; border-radius: 3px; overflow: hidden; margin-top: 3px; border: 1px solid #444; }
        #hp-bar { width: 100%; height: 100%; background: #e74c3c; transition: width 0.2s; }
        #exp-bar { width: 0%; height: 100%; background: #3498db; transition: width 0.2s; }
        #mp-bar { width: 100%; height: 100%; background: #f1c40f; transition: width 0.2s; }

        .battle-arena {
            width: 100%; height: 110px; 
            background: radial-gradient(circle at center, #26183b 0%, #0f071a 70%, #050308 100%);
            border: 2px solid #e74c3c; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-around; align-items: center; position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(231, 76, 60, 0.3);
        }
        .fighter-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 45%; height: 100%;
        }
        .fighter-avatar {
            font-size: 34px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
            animation: floatAnim 2s ease-in-out infinite;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .fighter-name { color: #f1c40f; font-weight: bold; font-size: 11px; margin-top: 4px; text-align: center; }

        #log-box {
            flex: 1; width: 100%; background: rgba(7, 9, 15, 0.95); border: 2px solid #30363d;
            border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 11px;
            line-height: 1.4; color: #c9d1d9; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px;
        }
        .log-msg { border-left: 3px solid #58a6ff; padding-left: 6px; }
        .log-warning { border-left-color: #e74c3c; color: #ff7b72; }
        .log-success { border-left-color: #2ea043; color: #7ee787; }
        .log-gold { border-left-color: #f1c40f; color: #f1e05a; }
        .log-event { border-left-color: #bc8cff; color: #d2a8ff; }
        .log-gear { border-left-color: #e67e22; color: #f39c12; font-weight: bold; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .action-btn {
            background: #1b222d; border: 2px solid #58a6ff; color: #58a6ff;
            padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
            text-align: center; font-size: 11px; font-family: inherit;
        }
        .action-btn:hover { background: #263140; border-color: #f1c40f; color: #f1c40f; }

        .cards-container { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; max-height: 360px; overflow-y: auto; }
        .card {
            background: rgba(22, 27, 34, 0.9); border: 2px solid #f1c40f; border-radius: 8px;
            padding: 12px 14px; text-align: left; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover { background: rgba(33, 38, 45, 0.95); transform: translateY(-2px); }
        .card h3 { margin: 0 0 4px 0; color: #f1c40f; font-size: 13px; }
        .card p { margin: 0; color: #8b949e; font-size: 11px; }
        .card.locked { opacity: 0.5; border-color: #444; cursor: not-allowed; }
        
        .rarity-blue { color: #58a6ff; }
        .rarity-purple { color: #bc8cff; text-shadow: 0 0 5px rgba(188,140,255,0.5); }
        .rarity-gold { color: #f1c40f; text-shadow: 0 0 8px rgba(241,196,15,0.8); }

        .status-box {
            background: rgba(13, 17, 23, 0.95); border: 2px solid #58a6ff; border-radius: 8px;
            padding: 12px; width: 100%; max-width: 340px; text-align: left; margin-bottom: 10px;
        }
        .status-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #30363d; font-size: 11px; }
        .equip-slot { background: #161b22; border: 1px solid #f1c40f; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }

        #modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: #161b22; border: 3px solid #2ecc71; border-radius: 12px;
            padding: 24px; width: 85%; max-width: 300px; text-align: center;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
        }
        .modal-box h2 { color: #2ecc71; margin-top: 0; margin-bottom: 10px; font-size: 18px; }
        .modal-box p { color: #fff; font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
        
        .gacha-animation {
            animation: shake 0.5s ease-in-out infinite;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. 登入畫面 -->
    <div id="login-screen" class="screen">
        <h1>🇭🇰 港風天堂生存 RPG</h1>
        <p>安全登入：已有帳號必須輸入密碼；新帳號請設定密碼</p>
        <input type="text" id="username-input" placeholder="輸入帳號 (例如: 旺角揸fit人)">
        <input type="password" id="password-input" placeholder="輸入密碼 (必填防盜)">
        <button class="btn" onclick="Game.login()">登入帳號冒險</button>
    </div>

    <!-- Rest of the full game content is being restored. For immediate play use the previous good commit link. -->
</div>
<script>

</script>
</body>
</html>
